name: Deploy API

# main に入った backend-go の変更を、本番(Cloud Run。東京)へ配る。
# 構成と、必要な値は docs/production-deploy.md にある。
#
# 流れ: マイグレーション → 新しいリビジョンを作る(要求はまだ流さない)
#      → そのリビジョン専用の URL で確かめる → 通ったら要求を切り替える
#      → 本番を確かめる(落ちたら直前のリビジョンに戻す)
# 確かめてから切り替えるので、壊れた版が本番に出ない。
on:
  push:
    branches: [main]
    paths:
      - "backend-go/**"
      - ".github/workflows/deploy-api.yml"
      - ".github/scripts/smoke-api.sh"
  # 手動でも配れる(基盤側だけ直したときなど)。main 以外からは配らない(下の if、
  # Production 環境の配信ブランチの制限、GCP 側の入り口の条件の三重)。
  workflow_dispatch:

permissions:
  contents: read
  # Workload Identity Federation で GCP に入るのに要る(鍵のファイルを持たない)。
  id-token: write

# 配信先は 1 つなので、同時に 2 つ走らせない。マイグレーションが並ぶのを防ぐ意味もある。
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  migrate:
    name: マイグレーションを当てる
    # 手動実行で別のブランチを選んでも、本番の DB には触らない。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    steps:
      - uses: actions/checkout@v4

      # 手元・CI と同じ migrate を使う(backend-go/docker-compose.yml と同じ版)。
      # 接続先は、pooler ではなく直結の URL にする(pooler 経由だと
      # "unnamed prepared statement does not exist" で落ちることがある)。
      - name: migrate up
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL}" || { echo "PROD_DATABASE_URL が未設定"; exit 1; }
          docker run --rm \
            -v "${PWD}/backend-go/db/migrations:/migrations:ro" \
            migrate/migrate:v4.18.1 \
            -path=/migrations -database "${DATABASE_URL}" up

  deploy:
    name: Cloud Run へ配る
    needs: migrate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    # 値は Production 環境から読む(環境の Variables は、環境を指定したジョブの中でしか見えない)。
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'burger-stack' }}
      REGION: ${{ vars.CLOUD_RUN_REGION || 'asia-northeast1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: いま要求を受けているリビジョンを控える(切り戻し用)
        id: before
        run: |
          set -euo pipefail
          prev=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$GCP_PROJECT" --format=json \
            | jq -r '[.status.traffic[] | select(.percent == 100)][0].revisionName // empty')
          echo "直前のリビジョン: ${prev:-なし}"
          echo "revision=${prev}" >> "$GITHUB_OUTPUT"

      # backend-go/Dockerfile(本番用の多段ビルド)を Cloud Build が使う。
      # --no-traffic で、要求はまだ流さない。candidate の札を付け、そのリビジョン専用の URL を作る。
      # 環境変数は Cloud Run 側に設定済みのものを引き継ぐ(ここでは触らない。
      # 触ると、GitHub に本番の秘密を全部置くことになる)。
      - name: 新しいリビジョンを作る(要求はまだ流さない)
        id: create
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --source backend-go \
            --region "$REGION" \
            --project "$GCP_PROJECT" \
            --no-traffic --tag candidate \
            --quiet
          desc=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$GCP_PROJECT" --format=json)
          rev=$(echo "$desc" | jq -r '.status.latestCreatedRevisionName')
          url=$(echo "$desc" | jq -r '.status.traffic[] | select(.tag == "candidate") | .url')
          test -n "$rev" && test -n "$url" || { echo "新しいリビジョンか、その URL が読めない"; exit 1; }
          echo "新しいリビジョン: ${rev} (${url})"
          echo "revision=${rev}" >> "$GITHUB_OUTPUT"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: 新しいリビジョンを確かめる
        run: .github/scripts/smoke-api.sh "${{ steps.create.outputs.url }}"

      - name: 要求を新しいリビジョンに切り替える
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --region "$REGION" --project "$GCP_PROJECT" \
            --to-revisions "${{ steps.create.outputs.revision }}=100" \
            --remove-tags candidate \
            --quiet

      - name: 本番を確かめる
        id: verify
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: .github/scripts/smoke-api.sh "${API_ORIGIN:-https://burger-stack-421794940461.asia-northeast1.run.app}"

      # 専用の URL で通っていれば、ここで落ちることはまずない。落ちたら直前のリビジョンに戻す。
      # マイグレーションは戻らない(前方互換が前提。docs/production-deploy.md)。
      - name: 失敗したので直前のリビジョンに戻す
        if: failure() && steps.verify.outcome == 'failure' && steps.before.outputs.revision != ''
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --region "$REGION" --project "$GCP_PROJECT" \
            --to-revisions "${{ steps.before.outputs.revision }}=100" \
            --quiet
