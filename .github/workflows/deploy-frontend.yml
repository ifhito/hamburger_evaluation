name: Deploy Frontend

# main に入った frontend の変更を、本番(Cloudflare Workers)へ配る。
# 構成と、必要な値は docs/production-deploy.md にある。
#
# 流れ: 本番ビルド → 版をアップロード(まだ配信しない) → その版のプレビュー URL で確かめる
#      → 通ったら切り替える → 本番を確かめる(落ちたら直前の版に戻す)
# 確かめてから切り替えるので、壊れた版が本番に出ない。
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
      - ".github/scripts/smoke-frontend.sh"
  # 手動でも配れる(設定だけ変えたときなど)。main 以外からは配らない(下の if と、
  # Production 環境の配信ブランチの制限の二重)。
  workflow_dispatch:

permissions:
  contents: read

# 配信先は 1 つなので、同時に 2 つ走らせない。走っている実行は止めない
# (途中で止めると、どちらが配信されたか分からなくなる)。
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Workers へ配る
    # 手動実行で別のブランチを選んでも、本番には配らない。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 値(トークン・アカウント ID)は Production 環境に置く。環境は main からしか使えない。
    environment: Production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # wrangler は devDependency に入れていないので、版を固定して実行する。
      WRANGLER: npx --yes wrangler@4.136.3
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 依存を入れる
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 本番ビルド
        working-directory: frontend
        run: pnpm run build

      - name: 版をアップロードする(まだ配信しない)
        id: upload
        working-directory: frontend
        run: |
          set -euo pipefail
          $WRANGLER versions upload --message "${GITHUB_SHA::7}" | tee /tmp/upload.log
          version_id=$(sed -n 's/^Worker Version ID: *//p' /tmp/upload.log)
          preview_url=$(sed -n 's/^Version Preview URL: *//p' /tmp/upload.log)
          test -n "${version_id}" || { echo "版の ID が読めない"; exit 1; }
          test -n "${preview_url}" || { echo "プレビュー URL が読めない(workers.dev のプレビューが無効かもしれない)"; exit 1; }
          echo "version_id=${version_id}" >> "$GITHUB_OUTPUT"
          echo "preview_url=${preview_url}" >> "$GITHUB_OUTPUT"

      # 新しいドメインは、切り替えるまで古い版を返すので、切り替え前の確認には使えない。
      # 版のプレビュー URL(workers.dev)で確かめる(wrangler.toml の preview_urls)。
      - name: プレビューで確かめる
        run: .github/scripts/smoke-frontend.sh "${{ steps.upload.outputs.preview_url }}"

      - name: 本番を切り替える
        working-directory: frontend
        run: $WRANGLER versions deploy "${{ steps.upload.outputs.version_id }}@100%" --message "${GITHUB_SHA::7}" --yes

      - name: 本番を確かめる
        id: verify
        env:
          ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
        run: .github/scripts/smoke-frontend.sh "${ORIGIN:-https://burger-stack.com}"

      # プレビューで通っていれば、ここで落ちることはまずない。落ちたら直前の版に戻す。
      - name: 失敗したので直前の版に戻す
        if: failure() && steps.verify.outcome == 'failure'
        working-directory: frontend
        run: $WRANGLER rollback --message "自動の切り戻し(${GITHUB_SHA::7} の確認に失敗)" --yes
