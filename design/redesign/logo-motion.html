<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BurgerStack ロゴが描かれていく動き(見本)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #ffffff; --text: #111111; --muted: #5a5a55; --border: #dedcd6; --logo-on-light: #b88f13; --logo-on-dark: #e9b824; }
  body { margin: 0; padding: 32px 16px 64px; background: var(--bg); color: var(--text); font: 400 15px/1.7 "Noto Sans JP", system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 24px; line-height: 1.4; }
  p { color: var(--muted); font-size: 14px; }
  .bar { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin: 16px 0 24px; }
  button { min-height: 44px; padding: 0 20px; border: 1px solid #6b6b66; border-radius: 8px; background: #fff; font: inherit; font-weight: 500; cursor: pointer; }
  button:focus-visible { outline: 3px solid #111; outline-offset: 2px; }
  .demo { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 24px; border-radius: 12px; align-items: center; }
  .demo.light { border: 1px solid var(--border); --line: var(--logo-on-light); }
  .demo.dark { margin-top: 16px; background: #111; color: #fff; --line: var(--logo-on-dark); }
  .lock { display: inline-flex; align-items: center; gap: 0.4em; font-size: 20px; letter-spacing: .01em; white-space: nowrap; }
  .lock b { font-weight: 700; } .lock i { font-style: normal; font-weight: 400; }
  /* 線が描かれていく動き。path に pathLength="1" を付けて、長さを測らずに、dasharray / dashoffset で描く */
  svg path.draw { stroke: var(--line); stroke-dasharray: 1 2; stroke-dashoffset: 1.02; animation: draw 2.2s cubic-bezier(.4, 0, .2, 1) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  /* 動きを減らす設定のときは、最初から、描き終えた形で出す */
  @media (prefers-reduced-motion: reduce) { svg path.draw { animation: none; stroke-dashoffset: 0; } }
</style>
</head>
<body>
<main>
  <h1>BurgerStack ロゴが描かれていく動き(見本)</h1>
  <p>ロゴの記号(レタスの波つきのバーガー。黄色の 1 本の線)が、ペンで描かれるように現れます(SVG の <code>stroke-dashoffset</code>)。OS の「視差効果を減らす」など(<code>prefers-reduced-motion</code>)のときは、動かさず、最初から描き終えた形で出します。<b>実装で使うかどうかは、未決です</b>(利用者が決めます)。白地は深い黄、暗い面は今の黄です。</p>

    <p style="margin-top:8px;color:#bbb">暗い面の上(今の黄。文字は白)。</p></div></div>
  <p id="rm" style="margin-top:16px"></p>
</main>
<script>
  document.getElementById('replay').addEventListener('click', () => document.querySelectorAll('path.draw').forEach((p) => { p.style.animation = 'none'; void p.getBoundingClientRect(); p.style.animation = ''; }));
  const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  const note = () => { document.getElementById('rm').textContent = mq.matches ? 'いまは「動きを減らす」設定なので、動かさず、描き終えた形で出しています。' : '「動きを減らす」設定にすると、動かさず、描き終えた形で出ます。'; };
  note(); mq.addEventListener('change', note);
</script>

</html>
