<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BurgerStack 線が描かれていく動き(見本)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #ffffff; --text: #111111; --muted: #5a5a55; --border: #dedcd6; --yellow: #e9b824; }
  body { margin: 0; padding: 32px 16px 64px; background: var(--bg); color: var(--text); font: 400 15px/1.7 "Noto Sans JP", system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 24px; line-height: 1.4; }
  p { color: var(--muted); font-size: 14px; }
  .bar { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin: 16px 0 24px; }
  label { font-size: 14px; }
  button { min-height: 44px; padding: 0 20px; border: 1px solid #6b6b66; border-radius: 8px; background: #fff; font: inherit; font-weight: 500; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid #111; outline-offset: 2px; }
  .demo { display: grid; grid-template-columns: 240px 1fr; gap: 24px; align-items: center; padding: 20px 0; border-top: 1px solid var(--border); }
  .lock { display: inline-flex; align-items: center; gap: 12px; font-size: 20px; white-space: nowrap; }
  .lock b { font-weight: 700; } .lock i { font-style: normal; font-weight: 400; }
  .demo h2 { margin: 0 0 4px; font-size: 16px; } .demo .muted { font-size: 13px; color: var(--muted); }
  /* 線が描かれていく動き。path に pathLength="1" を付けて、長さを測らずに、dasharray / dashoffset で描く。 */
  svg path.draw { stroke: var(--line, var(--yellow)); stroke-dasharray: 1 2; stroke-dashoffset: 1.02; animation: draw 1.6s cubic-bezier(.4, 0, .2, 1) var(--delay, 0s) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  /* 動きを減らす設定のときは、最初から、描き終えた形で出す */
  @media (prefers-reduced-motion: reduce) { svg path.draw { animation: none; stroke-dashoffset: 0; } }
</style>
</head>
<body>
<main>
  <h1>BurgerStack 線が描かれていく動き(見本)</h1>
  <p>一筆書きの黄色い線が、ペンで描かれるように現れます(SVG の <code>stroke-dashoffset</code>)。OS の「視差効果を減らす」など(<code>prefers-reduced-motion</code>)のときは、動かさず、最初から描き終えた形で出します。上位 3 案の見本です。実装で使うかは、利用者が決めます。</p>
  <div class="bar">
    <button id="replay" type="button">もう一度、描く</button>
    <label><input type="radio" name="c" value="a" checked> (A) いまのマスタード黄 #e9b824</label>
    <label><input type="radio" name="c" value="b"> (B) 深いマスタード黄 #b88f13</label>
  </div>
  <div id="demos"></div>
  <p id="rm"></p>
</main>
<script>
  const f1 = (v) => Math.round(v * 10) / 10;
  const ell = (cx, cy, rx, ry, a0, a1, n) => Array.from({ length: n + 1 }, (_, i) => { const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; return [cx + rx * Math.cos(a), cy - ry * Math.sin(a)]; });
  const pl = (pts) => 'M ' + pts.map(([x, y]) => `${f1(x)} ${f1(y)}`).join(' L ');
  const wv = (xs, xe, y, n, A) => { const dx = (xe - xs) / n, k = 0.36 * dx; let d = ''; for (let i = 0; i < n; i++) { const xa = xs + dx * i, xb = xa + dx, ya = y - (i % 2 ? A : 0), yb = y - ((i + 1) % 2 ? A : 0); d += ` C ${f1(xa + k)} ${ya} ${f1(xb - k)} ${yb} ${f1(xb)} ${yb}`; } return d; };
  const D = [
    { no: '03', name: 'S(バンズの形)', w: 8.5, d: pl(ell(60, 27, 36, 21, 35, 270, 44).concat(ell(60, 69, 36, 21, 90, -145, 44).slice(1))), note: 'S を書く順に、上の右端から描き始めます(始まりは、どこからでもよい)。' },
    { no: '07', name: 'かじった跡', w: 7, d: 'M 98 90 L 28 90 C 14 90 12 78 12 68 L 12 54 C 12 24 34 8 60 8 C 72 8 82 11 88 16 A 7 7 0 0 0 90 28 A 7 7 0 0 0 95 41 A 7 7 0 0 0 100 54 L 100 76 C 100 88 100 90 98 90 L 98 70 L 12 70 L 12 54' + wv(12, 100, 54, 6, -6), note: '下から輪郭を描き、かじった跡を通って、パティとレタスの波で終わります。' },
    { no: '02', name: '積み重ねた輪', w: 7.5, d: 'M 18 22 A 42 9 0 1 1 102 22 A 42 9 0 1 1 18 22 L 18 50 A 42 9 0 1 1 102 50 A 42 9 0 1 1 18 50 L 18 78 A 42 9 0 1 1 102 78 A 42 9 0 1 1 18 78', note: '輪を 1 つずつ描き、左の縁を下りて、次の輪へ進みます。' },
  ];
  const YEL = { a: '#e9b824', b: '#b88f13' };
  const draw = () => D.map((r, i) => `<svg viewBox="0 0 120 100" width="${r.h}" height="${r.h / 1.2}" aria-hidden="true"><path class="draw" pathLength="1" d="${r.d}" fill="none" stroke-width="${r.w}" stroke-linecap="round" stroke-linejoin="round" style="--delay:${i * 0.25}s"/></svg>`);
  const html = D.map((r, i) => { const big = (h) => `<svg viewBox="0 0 120 100" width="${h * 1.2}" height="${h}" aria-hidden="true"><path class="draw" pathLength="1" d="${r.d}" fill="none" stroke-width="${r.w}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    return `<div class="demo"><div>${big(180)}</div><div><h2>${r.no} ${r.name}</h2><div class="lock">${big(32)}<span><b>Burger</b><i>Stack</i></span></div><div class="muted" style="margin-top:6px">${r.note}</div></div></div>`; }).join('');
  document.getElementById('demos').innerHTML = html;
  const setColor = (c) => document.documentElement.style.setProperty('--line', YEL[c]);
  document.querySelectorAll('input[name=c]').forEach((el) => el.addEventListener('change', () => setColor(el.value)));
  const replay = () => document.querySelectorAll('path.draw').forEach((p) => { p.style.animation = 'none'; void p.getBoundingClientRect(); p.style.animation = ''; });
  document.getElementById('replay').addEventListener('click', replay);
  const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  const note = () => { document.getElementById('rm').textContent = mq.matches ? 'いまは「動きを減らす」設定なので、動かさず、描き終えた形で出しています。' : '「動きを減らす」設定にすると、動かさず、描き終えた形で出ます。'; };
  note(); mq.addEventListener('change', note);
</script>
</body>
</html>
