<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レビューの詳細(リデザインのラフ)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mock.css">
</head>
<body data-active="reviews">
<main class="wrap page">
  <a class="back" href="#" data-en="← Back to reviews">← レビュー一覧に戻る</a>
  <section class="hero">
    <div class="photo" style="--a:#5a3a22;--b:#1a120b"><span class="photo-label" data-en="Photo">写真</span></div>
    <div class="shade"></div>
    <div class="info"><h1 class="name">テリヤキバーガー</h1><p class="shop">J.S. BURGERS CAFE 新宿</p></div>
  </section>
  <div class="narrow">
    <section class="summary">
      <span class="avg">4.5</span>
      <div><span class="stars lg"><span class="on">★★★★</span><span class="off">★</span></span><p class="count" data-en="2 reviews">2 件のレビュー</p></div>
      <button class="btn primary" data-en="Write a review">レビューを書く</button>
    </section>
    <div class="section-head"><h2 data-en="Reviews">レビュー</h2><span class="count" data-en="Newest first">新しい順</span></div>
    <article class="ritem current">
      <div class="who"><span class="avatar">a</span><div class="grow"><b>alice</b><time data-en="Sep 21, 2026">2026年9月21日</time></div><span class="chip accent"><span data-en="Selected review">表示中のレビュー</span></span></div>
      <span class="stars" aria-label="5 段階中 4"><span class="on">★★★★</span><span class="off">★</span></span>
      <p class="comment">チーズの量がちょうどよかった。</p>
      <div class="actions"><button class="btn ghost" data-en="Edit">編集</button><button class="btn ghost" data-en="Delete">削除</button></div>
    </article>
    <article class="ritem">
      <div class="who"><span class="avatar">c</span><div class="grow"><b>charlie</b><time data-en="Sep 21, 2026">2026年9月21日</time></div></div>
      <span class="stars" aria-label="5 段階中 5"><span class="on">★★★★★</span><span class="off"></span></span>
      <p class="comment">また絶対行きたいです。</p>
    </article>
  </div>
</main>
<script src="mock.js"></script>
</body>
</html>
