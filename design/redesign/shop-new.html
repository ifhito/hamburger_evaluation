<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ショップの追加(リデザインの見本)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mock.css">
</head>
<body data-active="shops">
<main class="wrap page">
  <a class="back" href="#" data-en="← Back to shops">← ショップ一覧に戻る</a>
  <div class="narrow">
    <h1 data-en="Add a shop">ショップを追加する</h1>
    <p class="lead" data-en="Can't find the shop you visited? Add it here.">行ったお店が見つからないときは、ここから追加できます。</p>
    <form class="form">
      <div data-only="error"><section class="alert" role="alert"><i class="band"></i><span class="mark">!</span><div class="body"><b class="alert-title" data-en="Could not add the shop">ショップを追加できませんでした</b><p class="msg">Name can't be blank</p></div></section></div>
      <div class="notice" data-en="New shops are reviewed by our team before becoming public. You can review your own shop while it is pending.">新しいショップは、運営が確認してから、公開されます。審査中でも、自分で追加したショップには、レビューを書けます。</div>
      <div class="field"><label class="label" for="shopname" data-en="Shop name">ショップの名前</label><input class="input" id="shopname" data-only="default error" placeholder="例: Shake Shack 渋谷" data-en-ph="e.g. Shake Shack Shibuya"></div>
      <div class="actions-row" style="padding-top:0"><button type="button" class="btn primary wide" data-en="Submit for review">審査に出す</button><button type="button" class="btn ghost" data-en="Cancel">キャンセル</button></div>
    </form>
    <aside class="memo"><b>実装メモ</b><ul><li>・ショップの名前の規則(空・長さ)の判定と文言(<code>Name can&#39;t be blank</code> など)は、backend だけ。エラーは、API が返した文言をそのまま出す。</li><li>・追加したあとは、そのショップの詳細(審査待ち)へ進む。</li></ul></aside>
  </div>
</main>
<script src="rating-icons.js"></script>
<script src="mock.js"></script>
</body>
</html>
