<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ショップの編集・管理(リデザインの見本)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mock.css">
</head>
<body data-active="shops" data-user="admin">
<main class="wrap page">
  <div class="editcol">
    <a class="back" href="#">← ショップの管理に戻る</a>
    <h1>ショップを編集</h1>
    <form class="form">
      <div data-only="error"><section class="alert" role="alert"><i class="band"></i><span class="mark">!</span><div class="body"><b class="alert-title">保存できませんでした</b><p class="msg">Name is too long (maximum is 100 characters)</p></div></section></div>
      <div class="field"><label class="label" for="name">ショップの名前</label><input class="input" id="name" data-only="default" value="バーガースタンド 下北沢"><input class="input" id="name" data-only="error" value="バーガースタンド 下北沢(100 文字を超える、長い名前の見本)…"></div>
      <div class="actions-row"><button type="button" class="btn primary wide">保存する</button><button type="button" class="btn ghost">キャンセル</button></div>
    </form>
    <aside class="memo"><b>実装メモ</b><ul>
      <li>・変えられるのは、名前だけ(承認・却下は、管理の一覧の「承認する」「却下する」)。名前の長さの上限(いまは 100 文字)は backend だけが判定し、超えたときは、API の文言をそのまま出す。</li>
      <li>・この画面も、backend が返す(<code>can_moderate</code>)人だけが開ける。それ以外の人は、管理の一覧と同じ行き先(サインイン画面、またはショップの一覧)へ戻す。</li>
    </ul></aside>
  </div>
</main>
<script src="rating-icons.js"></script>
<script src="mock.js"></script>
</body>
</html>
