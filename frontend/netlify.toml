# Netlify。Phase 6 の検証で使う。
#
#   pnpm run build
#   npx netlify-cli login     # 初回のみ
#   npx netlify-cli deploy --prod --dir=dist
[build]
  publish = "dist"

# /api/* を API へ転送する。4 候補で最も記述量が少ない。
[[redirects]]
  from = "/api/*"
  to = "https://burger-stack-421794940461.asia-northeast1.run.app/:splat"
  status = 200
  force = true

# SPA の deep link。上の転送より後に書くこと(順に評価される)。
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
