server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Go 側の上限(写真つきの multipart は 6 MiB。JSON は Go が 1 MiB で 413 にする)に合わせる。既定の 1 MiB では写真が届かない
        client_max_body_size 6m;
        proxy_pass http://api-go:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # disk モードのレビュー写真（S10）。本番は R2 の絶対 URL を使うので、
    # これは disk モードのデプロイ向けの念のための設定である。これがないと
    # /photos/... は index.html にフォールバックしてしまう。rewrite はしない：
    # path はそのまま通る。
    location /photos/ {
        proxy_pass http://api-go:8080/photos/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
