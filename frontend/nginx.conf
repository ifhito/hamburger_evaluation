server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Go 側の上限(レビュー本文全体 6 MiB)に合わせる。既定の 1 MiB では写真が届かない
        client_max_body_size 6m;
        proxy_pass http://api-go:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Disk-mode review photos (S10). Production uses R2 absolute URLs, so
    # this is belt-and-braces for disk-mode deployments; without it
    # /photos/... would fall through to index.html. No rewrite: the path
    # passes through as-is.
    location /photos/ {
        proxy_pass http://api-go:8080/photos/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
