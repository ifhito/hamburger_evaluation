# 本番のフロントエンド(Cloudflare Workers の Static Assets)。
# 配るのは GitHub Actions(.github/workflows/deploy-frontend.yml)で、手元から配るときは
#
#   pnpm run build
#   npx wrangler login       # 初回のみ
#   npx wrangler deploy
#
# 構成と、なぜ Cloudflare なのかは docs/production-deploy.md を参照。
name = "hamburger-frontend"
main = "worker/index.js"
compatibility_date = "2026-09-01"

# 版ごとのプレビュー URL(<版>-hamburger-frontend.<アカウント>.workers.dev)を有効にしておく。
# CD は、新しい版をこの URL で確かめてから本番を切り替える。プレビュー URL は workers.dev の上に
# しか作れず、この設定を書いていないと workers.dev を止めたときに一緒に止まるため、明示する。
# 公開の入口は独自ドメイン(burger-stack.com。ダッシュボードで設定)で、workers.dev は止めてよい。
preview_urls = true

[assets]
directory = "./dist"
binding = "ASSETS"
# SPA なので、見つからない path は index.html を返す(deep link 対応)。
not_found_handling = "single-page-application"
# ブラウザのナビゲーション(Sec-Fetch-Mode: navigate)や SNS クローラーに対しては、既定だと
# アセット配信が Worker より先に働き、静的な index.html をそのまま返してしまう。
# /api/* の転送と、レビュー・バーガー・ショップ詳細ページの動的 OGP タグ注入のため、Worker を先に走らせる。
run_worker_first = ["/api/*", "/.well-known/*", "/reviews/*", "/burgers/*", "/shops/*"]

[vars]
# 転送先の API(Cloud Run。東京)。秘密ではないのでここに書く。
API_ORIGIN = "https://burger-stack-421794940461.asia-northeast1.run.app"
# GCP_SERVICE_ACCOUNT_JSON は Workers Secrets に設定する。秘密鍵はここに書かない。

# Cloud Run の status.url。候補リビジョンや公開の OAuth URL をトークンの宛先にしない。
CLOUD_RUN_AUDIENCE = "https://burger-stack-azcarxd7mq-an.a.run.app"
