services:
  api-go:
    build: .
    # ビルドしてから exec することで、コンパイルされたバイナリが PID 1 になり、
    # `docker stop` からの SIGTERM を受け取る（go run はそれを API プロセスに
    # 転送しない）。
    command: ["sh", "-c", "go build -o /tmp/api ./cmd/api && exec /tmp/api"]
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://postgres:password@db:5432/hamburger_evaluation_go_development?sslmode=disable
      # JWT_SECRET が未設定だと api は起動時に fail-loud する。
      # `docker compose up` の前に export しておくこと
      # （例：`export JWT_SECRET=...`）。
      # JWT_SECRET は必ず設定しなければならない。トークンはこの secret で
      # 署名および検証される。
      JWT_SECRET: ${JWT_SECRET:-}
      GOMEMLIMIT: 920MiB
    mem_limit: 1g

  # 使い方：docker compose run --rm migrate up
  #         docker compose run --rm migrate down -all
  # 別のデータベース（例：テスト用のもの）を対象にするには：
  #   MIGRATE_DATABASE_URL=postgres://postgres:password@db:5432/hamburger_evaluation_go_test?sslmode=disable \
  #     docker compose run --rm migrate up
  migrate:
    image: migrate/migrate:v4.18.1
    profiles: ["tools"]
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      [
        "migrate",
        "-path", "/migrations",
        "-database", "${MIGRATE_DATABASE_URL:-postgres://postgres:password@db:5432/hamburger_evaluation_go_development?sslmode=disable}",
      ]

  # 使い方：docker compose run --rm seed   （`migrate up` の後）
  # 冪等な開発用 fixture（admin + alice/bob/charlie、shops、burgers、
  # reviews、burger_stats）。cmd/seed/main.go を参照。
  # DATABASE_URL=... docker compose run --rm seed で、別のデータベースを
  # 対象にできる。
  seed:
    build: .
    profiles: ["tools"]
    command: ["go", "run", "./cmd/seed"]
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:password@db:5432/hamburger_evaluation_go_development?sslmode=disable}

  # 使い方：docker compose run --rm sqlc generate
  sqlc:
    image: sqlc/sqlc:1.27.0
    profiles: ["tools"]
    working_dir: /src
    volumes:
      - .:/src

  db:
    image: postgres:16
    volumes:
      - postgres_go_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hamburger_evaluation_go_development
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_go_data:
  go_mod_cache:
  go_build_cache:
