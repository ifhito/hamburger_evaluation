services:
  api-go:
    build: .
    # ビルドしてから exec することで、コンパイルされたバイナリが PID 1 になり、
    # `docker stop` からの SIGTERM を受け取る（go run はそれを API プロセスに
    # 転送しない）。
    command: ["sh", "-c", "go build -o /tmp/api ./cmd/api && exec /tmp/api"]
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://postgres:password@db:5432/hamburger_evaluation_go_development?sslmode=disable
      # JWT_SECRET が未設定だと api は起動時に fail-loud する。
      # `docker compose up` の前に export しておくこと
      # （例：`export JWT_SECRET=...`）。
      # JWT_SECRET は必ず設定しなければならない。トークンはこの secret で
      # 署名および検証される。
      JWT_SECRET: ${JWT_SECRET:-}
      GOMEMLIMIT: 920MiB
      # signup の確認メール。開発では、下の mailpit(認証なし・暗号化なし)へ送る。
      # 本番は SMTP_HOST・SMTP_PORT・SMTP_SECURITY(tls / starttls)・SMTP_USER・SMTP_PASSWORD を
      # 設定し、MAIL_FROM は検証済みの送信元にする(例は CLAUDE.md の「signup の確認メール」)。
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURITY: none
      MAIL_FROM: "BurgerStack <noreply@burgerstack.example.com>"
      # 確認メールのリンクの生成元(frontend の URL)。
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      # OAuth の認可サーバー(AI アプリがログインと許可だけでつなぐ仕組み)。OAUTH_ISSUER を設定した
      # ときだけ有効になる(例: `export OAUTH_ISSUER=http://localhost:8080`)。OAUTH_TOKEN_SECRET は
      # 32 文字以上の秘密の鍵で、有効にするなら必須(`export OAUTH_TOKEN_SECRET=$(openssl rand -hex 32)`)。
      # ほかの OAUTH_* は CLAUDE.md の「OAuth の認可サーバー」を参照。
      OAUTH_ISSUER: ${OAUTH_ISSUER:-}
      OAUTH_TOKEN_SECRET: ${OAUTH_TOKEN_SECRET:-}
      OAUTH_RESOURCE_URL: ${OAUTH_RESOURCE_URL:-}
      OAUTH_CONSENT_URL: ${OAUTH_CONSENT_URL:-}
      OAUTH_STATIC_CLIENTS: ${OAUTH_STATIC_CLIENTS:-}
      # リモートの MCP(/mcp)が受け付ける Origin(ブラウザが付ける要求元。DNS の付け替え攻撃への対策)。
      # カンマ区切りの `scheme://host[:port]`。空なら OAUTH_ISSUER の Origin だけ。Origin のない要求
      # (Claude Code などブラウザ以外)は、この設定に関係なく通る。例: MCP_ALLOWED_ORIGINS=http://localhost:5173
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      # Google のアカウントでのサインイン。GOOGLE_CLIENT_ID を設定したときだけ有効になる(手順は
      # docs/google-login-setup.md)。GOOGLE_CLIENT_SECRET は秘密の鍵で、有効にするなら必須(環境変数だけで渡し、
      # ファイル・リポジトリには書かない)。GOOGLE_REDIRECT_URL は、Google Cloud Console に登録した「承認済みの
      # リダイレクト URI」と同じ値(例: `export GOOGLE_REDIRECT_URL=http://localhost:5173/api/auth/google/callback`。画面の `/api` を通る形にする)。
      # GOOGLE_OIDC_ISSUER は、テストや隔離した確認で、代役の提供元に向けるときだけ設定する(本番では設定しない)。
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
      GOOGLE_OIDC_ISSUER: ${GOOGLE_OIDC_ISSUER:-}
    mem_limit: 1g

  # 開発用のメール受信。api-go の確認メールを SMTP :1025(compose のネットワーク内だけ)で
  # 受け取り、Web UI(http://localhost:8025)で読める。
  mailpit:
    image: axllent/mailpit:v1.22.3
    ports:
      - "8025:8025"

  # 使い方：docker compose run --rm migrate up
  #         docker compose run --rm migrate down -all
  # 別のデータベース（例：テスト用のもの）を対象にするには：
  #   MIGRATE_DATABASE_URL=postgres://postgres:password@db:5432/hamburger_evaluation_go_test?sslmode=disable \
  #     docker compose run --rm migrate up
  migrate:
    image: migrate/migrate:v4.18.1
    profiles: ["tools"]
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      [
        "migrate",
        "-path", "/migrations",
        "-database", "${MIGRATE_DATABASE_URL:-postgres://postgres:password@db:5432/hamburger_evaluation_go_development?sslmode=disable}",
      ]

  # 使い方：docker compose run --rm seed   （`migrate up` の後）
  # 冪等な開発用 fixture（admin + alice/bob/charlie、shops、burgers、
  # reviews、burger_stats）。cmd/seed/main.go を参照。
  # DATABASE_URL=... docker compose run --rm seed で、別のデータベースを
  # 対象にできる。
  seed:
    build: .
    profiles: ["tools"]
    command: ["go", "run", "./cmd/seed"]
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:password@db:5432/hamburger_evaluation_go_development?sslmode=disable}

  # 使い方：docker compose run --rm sqlc generate
  sqlc:
    image: sqlc/sqlc:1.27.0
    profiles: ["tools"]
    working_dir: /src
    volumes:
      - .:/src

  db:
    image: postgres:16
    volumes:
      - postgres_go_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hamburger_evaluation_go_development
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_go_data:
  go_mod_cache:
  go_build_cache:
