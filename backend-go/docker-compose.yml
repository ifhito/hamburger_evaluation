services:
  api-go:
    build: .
    # Build then exec so the compiled binary is PID 1 and receives SIGTERM
    # from `docker stop` (go run would not forward it to the API process).
    command: ["sh", "-c", "go build -o /tmp/api ./cmd/api && exec /tmp/api"]
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://postgres:password@db:5432/hamburger_evaluation_go_development?sslmode=disable
      # The api fails loudly at boot when JWT_SECRET is unset; export it
      # before `docker compose up` (e.g. `export JWT_SECRET=...`).
      # For tokens issued by the Rails backend to remain valid, JWT_SECRET
      # must equal the Rails secret_key_base.
      JWT_SECRET: ${JWT_SECRET:-}
      GOMEMLIMIT: 920MiB
    mem_limit: 1g

  # Usage: docker compose run --rm migrate up
  #        docker compose run --rm migrate down -all
  # Target another database (e.g. the test one) with:
  #   MIGRATE_DATABASE_URL=postgres://postgres:password@db:5432/hamburger_evaluation_go_test?sslmode=disable \
  #     docker compose run --rm migrate up
  migrate:
    image: migrate/migrate:v4.18.1
    profiles: ["tools"]
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      [
        "migrate",
        "-path", "/migrations",
        "-database", "${MIGRATE_DATABASE_URL:-postgres://postgres:password@db:5432/hamburger_evaluation_go_development?sslmode=disable}",
      ]

  # Usage: docker compose run --rm seed   (after `migrate up`)
  # Idempotent dev fixtures (admin + alice/bob/charlie, shops, burgers,
  # reviews, burger_stats); see cmd/seed/main.go. Target another database
  # with DATABASE_URL=... docker compose run --rm seed
  seed:
    build: .
    profiles: ["tools"]
    command: ["go", "run", "./cmd/seed"]
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:password@db:5432/hamburger_evaluation_go_development?sslmode=disable}

  # Usage: docker compose run --rm sqlc generate
  sqlc:
    image: sqlc/sqlc:1.27.0
    profiles: ["tools"]
    working_dir: /src
    volumes:
      - .:/src

  db:
    image: postgres:16
    volumes:
      - postgres_go_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hamburger_evaluation_go_development
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_go_data:
  go_mod_cache:
  go_build_cache:
